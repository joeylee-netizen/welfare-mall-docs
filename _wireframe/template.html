<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Wireframe metadata -->
  <meta name="wfr-id"      content="BO-XXX-000">
  <meta name="wfr-title"   content="화면 제목">
  <meta name="wfr-domain"  content="domain">
  <meta name="wfr-route"   content="/bo/path">
  <meta name="wfr-version" content="1.0">

  <title>BO-XXX-000 — 화면 제목 | 임직원 복지몰</title>
  <link rel="stylesheet" href="../../_wireframe/base.css">
</head>
<body>

<div class="wf-layout">

  <!-- ── GNB ────────────────────────────────── -->
  <header class="wf-gnb" data-region="gnb">
    <span class="gnb-logo">임직원 복지몰</span>
    <span class="gnb-service">BO 관리자</span>
    <span class="wf-ml-auto wf-text-sm">관리자님 환영합니다</span>
  </header>

  <!-- ── LNB ────────────────────────────────── -->
  <aside class="wf-lnb" data-region="lnb">
    <nav>
      <div class="lnb-group">상품 관리</div>
      <ul>
        <li><a href="#" class="active">상품 목록</a></li>
        <li><a href="#">상품 등록</a></li>
        <li><a href="#">카테고리 관리</a></li>
      </ul>
      <div class="lnb-group">클레임 관리</div>
      <ul>
        <li><a href="#">클레임 목록</a></li>
        <li><a href="#">클레임 처리</a></li>
      </ul>
    </nav>
  </aside>

  <!-- ── Content ────────────────────────────── -->
  <main class="wf-content" data-region="content">
    <h1>화면 제목</h1>

    <!-- 검색/필터 영역 -->
    <section data-component="BO-XXX-000" data-title="필터 컴포넌트">
      <div class="wf-filter-row">
        <select class="wf-select"><option>전체</option></select>
        <input class="wf-input" type="text" placeholder="검색어 입력">
        <button class="wf-btn wf-btn--primary" data-action="BO-XXX-000" data-trigger="click">검색</button>
      </div>
    </section>

    <!-- 목록 영역 -->
    <section data-component="BO-XXX-000" data-title="목록 테이블" class="wf-mt">
      <div class="wf-flex-between wf-mb">
        <span class="wf-text-sm wf-text-muted">총 <strong>0</strong>건</span>
        <button class="wf-btn wf-btn--primary" data-action="BO-XXX-000" data-trigger="click">등록</button>
      </div>
      <table class="wf-table">
        <thead>
          <tr>
            <th><input type="checkbox"></th>
            <th>No</th>
            <th>컬럼 1</th>
            <th>컬럼 2</th>
            <th>상태</th>
            <th>관리</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><input type="checkbox"></td>
            <td>1</td>
            <td><a href="#">샘플 데이터</a></td>
            <td>값</td>
            <td><span class="wf-badge wf-badge--ready">정상</span></td>
            <td><button class="wf-btn wf-btn--text wf-btn--sm">수정</button></td>
          </tr>
        </tbody>
      </table>
      <div class="wf-pagination">
        <button class="wf-pagination-btn">&laquo;</button>
        <button class="wf-pagination-btn active">1</button>
        <button class="wf-pagination-btn">2</button>
        <button class="wf-pagination-btn">3</button>
        <button class="wf-pagination-btn">&raquo;</button>
      </div>
    </section>
  </main>

</div>

<script>
// LNB active state
document.querySelectorAll('.wf-lnb a').forEach(link => {
  link.addEventListener('click', e => {
    e.preventDefault();
    document.querySelectorAll('.wf-lnb a').forEach(l => l.classList.remove('active'));
    link.classList.add('active');
  });
});
</script>

</body>
</html>
